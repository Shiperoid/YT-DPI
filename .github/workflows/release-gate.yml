# Heavy matrix only when YT-DPI.ps1 / .bat / .sh (or this workflow) change.
# Docs/algorithm/etc. PRs still get a green "gate" conclusion via skip job so
# branch protection is not stuck at "Waiting for status to be reported".
name: release-gate

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'YT-DPI.ps1'
              - 'YT-DPI.bat'
              - 'YT-DPI.sh'
              - '.github/workflows/release-gate.yml'

  gate-matrix:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        pwsh_version: ['7.2.23', '7.4.15', 'latest']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell (pwsh on PATH for gate)
        uses: PSModule/install-powershell@v1
        with:
          Version: ${{ matrix.pwsh_version }}

      - name: Run release gate (orchestrator = PS 5.1; children = 5.1 x64/WOW64 + all pwsh candidates)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE 'tools\release-gate.ps1') -RepoRoot $env:GITHUB_WORKSPACE

  # Required check should point at this job (not the matrix). Skip = green.
  gate:
    needs: [changes, gate-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conclude
        run: |
          changes='${{ needs.changes.result }}'
          scripts='${{ needs.changes.outputs.scripts }}'
          matrix='${{ needs.gate-matrix.result }}'
          echo "changes=$changes scripts=$scripts gate-matrix=$matrix"
          if [ "$changes" != "success" ]; then
            echo "paths-filter job failed"
            exit 1
          fi
          if [ "$scripts" != "true" ]; then
            echo "No YT-DPI.ps1/.bat/.sh (or workflow) changes - gate skipped."
            exit 0
          fi
          if [ "$matrix" = "success" ]; then
            exit 0
          fi
          echo "release-gate matrix failed or was cancelled (result=$matrix)"
          exit 1
